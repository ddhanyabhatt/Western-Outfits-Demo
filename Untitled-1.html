<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <form action="/submit_form_info">
        <label for="1">Enter Username:</label>
        <input type="text" name="Username" id="1" required>
        <br><br>
        <label for="2">Enter Email:</label>
        <input type="email" name="email" id="2">
        <br><br>
        <label for="number">Enter Mobile Number:</label>
        <input type="number" name="number" id="number">
        <br><br>
        <label for="3">Dress Color:</label>
        <input type="color" name="color" id="3">
        <br><br>
        <label for="Gender and Category">Select Gender and Category</label>
        <select name="Gender and Category" id="Gender and Category">
        <option value="Choose one">Choose one</option>  
        <option value="Men">Men</option>
        <option value="Women">Women</option>
        <option value="Boys">Boys</option>
        <option value="Girls">Girls</option>
        <option value="Diptis">Diptis</option>  
        </select>
        <br><br>
        <label for="cb">I agree to follow all terms and conditions.</label>
        <input type="checkbox" name="tnc" id="cb" required>
        <br><br>
        <label for="Regular Customer">Regular Customer</label>
        <input type="radio" name="D" id="Regular Customer" value="Regular Customer"><br>
        <label for="Have Bought Before">Have Bought Before</label>
        <input type="radio" name="D" id="Have Bought Before" value="Have Bought Before"><br>
        <label for="First Time">First Time</label>
        <input type="radio" name="D" id="First Time" value="First Time">
        <br><br>
      <button>Submit the form</button>

    </form>
    <br><br>
    <nav>
        <a href="./Normal.html">Back to Home Page</a>
    </nav>
</body>
</html>
